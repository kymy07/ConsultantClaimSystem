name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & document generation tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check JavaScript syntax
        run: |
          for f in assets/js/*.js test/*.js; do
            node --check "$f"
            echo "ok  $f"
          done

      - name: Verify vendored libraries are present
        run: |
          missing=0
          for f in jspdf.umd.min.js jspdf.plugin.autotable.min.js exceljs.min.js \
                   FileSaver.min.js signature_pad.umd.min.js docx.umd.js \
                   pdf.min.js pdf.worker.min.js pdfjs-Apache-2.0.txt \
                   carlito.js Carlito-OFL.txt; do
            if [ -s "vendor/$f" ]; then
              echo "ok  vendor/$f ($(wc -c < "vendor/$f") bytes)"
            else
              echo "MISSING  vendor/$f"; missing=1
            fi
          done
          exit $missing

      - name: Scan for personal data
        run: |
          # This repository is public. Malaysian IC numbers (xxxxxx-xx-xxxx) and bank
          # account numbers must never be hard-coded here — only generic examples.
          # vendor/ is excluded because it holds third-party libraries.
          hits=$(grep -rnIE '[0-9]{6}-[0-9]{2}-[0-9]{4}|[0-9]-[0-9]{5}-[0-9]{7}-[0-9]' \
                   index.html assets test README.md \
                 | grep -vE '010203-04-0567|1-23456-0001234-5' || true)
          if [ -n "$hits" ]; then
            echo "Found what looks like real personal data:"
            echo "$hits"
            exit 1
          fi
          echo "ok  no personal data detected"

      - name: Test the page itself (markup + stylesheet)
        run: node test/page.test.js

      - name: Test the sign-in gate
        run: node test/auth.test.js

      - name: Test the database sync
        run: node test/sync.test.js

      - name: Test document generation (PDF / Excel / Word)
        run: node test/generate.test.js

      - name: Test the draft moving on to a new month
        run: node test/month-roll.test.js

      # Added with the screens they cover, but never run — a test nothing
      # runs is a comment that takes longer to write.
      - name: Test the archive Download all builds
        run: node test/zip.test.js

      - name: Test the documents-to-collect table
        run: node test/history.test.js

      - name: Test who gets the profile controls
        run: node test/profile-access.test.js

      - name: Test signature controls by account role
        run: node test/signature-access.test.js
